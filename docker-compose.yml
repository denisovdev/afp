services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antifraud
      POSTGRES_PASSWORD: antifraud
      POSTGRES_DB: antifraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraud"]
      interval: 2s
      timeout: 5s
      retries: 10

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://antifraud:antifraud@postgres:5432/antifraud?sslmode=disable"
      HTTP_ADDR: ":8080"
      MATCH_THRESHOLD: "0.75"
      MIGRATIONS_DIR: "/migrations"
      PRIVATE_KEY: "${PRIVATE_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
